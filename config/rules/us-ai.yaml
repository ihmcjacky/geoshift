  # Google shared session/auth/static infra used by the Gemini web app.
  # Without these, the page's own auth/telemetry/asset requests fall through
  # to MATCH,DIRECT (real HK IP) while gemini.google.com / generativelanguage.googleapis.com
  # go through US-PROXY -> Google sees two different source IPs for the same
  # session and blocks it as "unusual traffic" / IP mismatch.
  - DOMAIN-SUFFIX,accounts.google.com
  - DOMAIN-SUFFIX,accounts.youtube.com
  - DOMAIN-SUFFIX,myaccount.google.com
  - DOMAIN-SUFFIX,ogs.google.com
  - DOMAIN-SUFFIX,apis.google.com
  - DOMAIN-SUFFIX,play.google.com
  - DOMAIN-SUFFIX,googleapis.com
  - DOMAIN-SUFFIX,gstatic.com
  - DOMAIN-SUFFIX,googleusercontent.com
  - DOMAIN,google.com
  - DOMAIN,www.google.com
  # Cursor IDE - api/auth/marketplace/download backends (per cursor.com/docs/enterprise/network-configuration).
  # Cursor was silently dropping Claude models from the model list; same IP-mismatch
  # pattern as Gemini above - IDE traffic (api*.cursor.sh) must not fall through to DIRECT
  # while account auth (authenticate.cursor.sh, cursor.com login) does.
  # DOMAIN-SUFFIX already matches all subdomains, so this also covers:
  #   api2-5.cursor.sh, repo42.cursor.sh, *.gcpp.cursor.sh, agent*.api5.cursor.sh,
