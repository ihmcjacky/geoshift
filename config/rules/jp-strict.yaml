# Proxy target (JP-STRICT) is assigned in config.yaml via RULE-SET.
# These sites require a residential/VPN IP (e.g. NordVPN-JP) to pass geo checks.
# To add domains: append entries here, commit, then run "geoshift sync && geoshift reload"
