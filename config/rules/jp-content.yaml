# JP content rules - loaded by Mihomo rule-providers (classical behavior).
# Proxy target (JP-PROXY) is assigned in config.yaml via RULE-SET.
# Strict geo-lock sites (e.g. Abema) live in jp-strict.yaml -> JP-STRICT instead.
# To add domains: append entries here, commit, then run "geoshift sync && geoshift reload"
# on each device. No tunnel restart needed.
payload:
  - DOMAIN-SUFFIX,dmm.co.jp
  - DOMAIN-SUFFIX,dmm.com
  - DOMAIN-SUFFIX,fanza.com
  - DOMAIN-SUFFIX,fanza.jp
  - DOMAIN-SUFFIX,nicovideo.jp
  - DOMAIN-SUFFIX,dmc.nico
  - DOMAIN-SUFFIX,nico.ms
  - DOMAIN-SUFFIX,pixiv.net
  - DOMAIN-SUFFIX,pximg.net
  - DOMAIN-SUFFIX,pixivision.net
  - DOMAIN-SUFFIX,tver.jp
  - DOMAIN-SUFFIX,streaks.jp
  - DOMAIN-SUFFIX,jocdn.net
  - DOMAIN-SUFFIX,navismithapis-cdn.com
  - DOMAIN-SUFFIX,navismithapis.com
  - DOMAIN-SUFFIX,dmm-extension.com
  - DOMAIN-SUFFIX,inmobi.com
  - DOMAIN-SUFFIX,omappapi.com
  - DOMAIN-SUFFIX,attackers.net
  - DOMAIN-SUFFIX,ideapockets.com
  - DOMAIN-SUFFIX,faleno.jp
  - DOMAIN-SUFFIX,justwatch.com
  - DOMAIN-SUFFIX,imagedelivery.net
  # GitHub - downloads from HK are flaky (release assets, archives, raw files, ghcr images),
  # so all GitHub traffic exits via the JP tunnel. Not geo-locked; this is for stability only.
  # github.com covers api./codeload./gist./uploads./npm.pkg.; githubusercontent.com covers
  # raw./objects./release-assets./avatars./camo.; github-cloud.s3 is the legacy release/LFS host.
  - DOMAIN-SUFFIX,github.com
  - DOMAIN-SUFFIX,githubusercontent.com
  - DOMAIN-SUFFIX,githubassets.com
  - DOMAIN-SUFFIX,githubapp.com
  - DOMAIN-SUFFIX,github.io
  - DOMAIN-SUFFIX,ghcr.io
  - DOMAIN,github-cloud.s3.amazonaws.com
  # FANZA / DMM family - subdomains of dmm.co.jp / dmm.com are already covered above.
  # These are the extra first-party domains the FANZA/DMM pages load: dmm.ai = API
  # (api-gcp.dmm.ai), dmmgames.com / fanzagames-official.com = DMM GAMES / FANZA GAMES.
  - DOMAIN-SUFFIX,dmm.ai
  - DOMAIN-SUFFIX,dmmgames.com
  - DOMAIN-SUFFIX,fanzagames-official.com
  # Kanto TV stations: Tokyo key stations + independent UHF stations. Subdomains are covered
  # (news.ntv.co.jp = NNN news, fod.fujitv.co.jp = FOD, video.tv-tokyo.co.jp = Net de Tele-Tokyo).
  # NHK: NHK ONE lives on the .nhk brand TLD (one.nhk, web.nhk, ac1.nhk), so suffix "nhk" covers it.
  - DOMAIN-SUFFIX,nhk
  - DOMAIN-SUFFIX,nhk.or.jp
  - DOMAIN-SUFFIX,nhk.jp
  - DOMAIN-SUFFIX,nhk-ondemand.jp
  - DOMAIN-SUFFIX,ntv.co.jp
  - DOMAIN-SUFFIX,tv-asahi.co.jp
  - DOMAIN-SUFFIX,telasa.jp
  - DOMAIN-SUFFIX,tbs.co.jp
  - DOMAIN-SUFFIX,tv-tokyo.co.jp
  - DOMAIN-SUFFIX,txn.co.jp
  - DOMAIN-SUFFIX,fujitv.co.jp
  - DOMAIN-SUFFIX,fnn.jp
  - DOMAIN-SUFFIX,mxtv.jp
  - DOMAIN-SUFFIX,tvk-yokohama.com
  - DOMAIN-SUFFIX,chiba-tv.com
  - DOMAIN-SUFFIX,teletama.jp
  - DOMAIN-SUFFIX,gtv.co.jp
  - DOMAIN-SUFFIX,tochigi-tv.jp
